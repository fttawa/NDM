name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Native build tools
        run: choco install nasm strawberryperl ninja --no-progress -y

      - name: Prepare release notes
        id: notes
        run: |
          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          Get-Content -LiteralPath RELEASE_NOTES.md -Raw >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "NDM ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw 'Release tag does not match app version' }
          $installer = "NDM_${version}_x64-setup.exe"
          $release = gh release view ${{ github.ref_name }} --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read release assets' }
          foreach ($name in @($installer, "$installer.sig", 'latest.json')) {
            if ($name -notin $release.assets.name) { throw "Missing release asset: $name" }
          }
          gh release download ${{ github.ref_name }} --pattern latest.json --pattern "$installer.sig" --dir release-verification
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download updater metadata' }
          $manifest = Get-Content release-verification/latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw 'Updater manifest version mismatch' }
          $signature = (Get-Content "release-verification/$installer.sig" -Raw).Trim()
          $asset = $release.assets | Where-Object name -eq $installer
          $assetId = ($asset.apiUrl -split '/')[-1]
          $allowedUrls = @($asset.url, "https://github.com/repos/fttawa/NDM/releases/assets/$assetId", "https://api.github.com/repos/fttawa/NDM/releases/assets/$assetId")
          foreach ($platform in @('windows-x86_64', 'windows-x86_64-nsis')) {
            $entry = $manifest.platforms.$platform
            if (-not $entry -or $entry.signature.Trim() -ne $signature -or $entry.url -notin $allowedUrls) { throw "Invalid updater entry: $platform" }
          }
          gh release edit ${{ github.ref_name }} --draft=false --latest --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }
